name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller PyQt6 cryptography
      - run: python -m PyInstaller --onefile --windowed --name GitRewind --icon icon.ico --add-data "icon.png;." git_rewind_gui.py
      - run: |
          mkdir "out"
          copy "dist\GitRewind.exe" "out\"
          Compress-Archive -Path "out\*" -DestinationPath "GitRewind-Windows-x64.zip"
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: GitRewind-Windows-x64
          path: GitRewind-Windows-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller PyQt6 cryptography
      - run: python -m PyInstaller --onefile --windowed --name GitRewind --add-data "icon.png:." git_rewind_gui.py
      - run: |
          cp dist/GitRewind GitRewind
          chmod +x GitRewind
          zip GitRewind-Linux-x64.zip GitRewind
      - uses: actions/upload-artifact@v7
        with:
          name: GitRewind-Linux-x64
          path: GitRewind-Linux-x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller PyQt6 cryptography
      - run: python -m PyInstaller --onefile --windowed --name GitRewind --add-data "icon.png:." git_rewind_gui.py
      - run: |
          cp dist/GitRewind GitRewind
          chmod +x GitRewind
          zip GitRewind-macOS-arm64.zip GitRewind
      - uses: actions/upload-artifact@v7
        with:
          name: GitRewind-macOS-arm64
          path: GitRewind-macOS-arm64.zip

  release:
    needs: [build-windows, build-linux, build-macos]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v7
        with:
          name: GitRewind-Windows-x64
          path: out
      - uses: actions/download-artifact@v7
        with:
          name: GitRewind-Linux-x64
          path: out
      - uses: actions/download-artifact@v7
        with:
          name: GitRewind-macOS-arm64
          path: out
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE_TAG="$(python3 - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path("git_rewind_gui.py").read_text(encoding="utf-8"))
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == "APP_VERSION":
                          print(ast.literal_eval(node.value))
                          raise SystemExit
          raise SystemExit("APP_VERSION not found")
          PY
          )"
          RELEASE_TITLE="GitRewind ${RELEASE_TAG}"
          RELEASE_NOTES="${RELEASE_TITLE} - Multi-OS-Builds: Windows x64, Linux x64, macOS arm64."

          mkdir -p assets
          cp out/GitRewind-Windows-x64.zip out/GitRewind-Linux-x64.zip out/GitRewind-macOS-arm64.zip assets/
          gh release delete "$RELEASE_TAG" --yes || true
          sleep 5
          gh release create "$RELEASE_TAG" \
            assets/GitRewind-Windows-x64.zip \
            assets/GitRewind-Linux-x64.zip \
            assets/GitRewind-macOS-arm64.zip \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest
          exit 0
